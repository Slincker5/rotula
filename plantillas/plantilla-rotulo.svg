<?xml version="1.0" encoding="UTF-8"?>
<!--
  plantilla-rotulo.svg — arte de fondo de un rótulo (A6: 105 x 148.5 mm)

  Edítalo en Figma, Illustrator o Inkscape y vuelve a exportarlo como PDF:
      npm run plantilla     (ver package.json)
      o: cairosvg plantilla-rotulo.svg -o plantilla-rotulo.pdf

  Solo lleva formas: NO pongas texto aquí. Todo lo variable (descripción,
  precios, fechas, código de barras) lo dibuja encima generarRotulos.js.
  Si mueves un bloque, ajusta las constantes de la sección ZONAS en ese archivo.

  Unidades = milímetros (viewBox 105 x 148.5).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="105mm" height="148.5mm" viewBox="0 0 105 148.5">

  <rect width="105" height="148.5" fill="#FFFFFF"/>

  <!-- barra de marca: a sangre, también marca la línea de corte -->
  <rect id="barra-marca" width="105" height="3.4" fill="#C1121F"/>

  <!-- bloque de precio: a sangre, con el filo inferior inclinado -->
  <polygon id="bloque-precio" points="0,46 105,46 105,107 0,112" fill="#C1121F"/>

  <!-- regla del pie -->
  <line id="regla-pie" x1="7" y1="127" x2="98" y2="127"
        stroke="#000000" stroke-width="0.4"/>
</svg>
